services:
  postgres:
    image: postgres:16-alpine
    container_name: app-financial-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_financial
      POSTGRES_PASSWORD: app_financial_dev
      POSTGRES_DB: app_financial
    ports:
      - "5432:5432"
    volumes:
      - app_financial_pgdata:/var/lib/postgresql/data

volumes:
  app_financial_pgdata: